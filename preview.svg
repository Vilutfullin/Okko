<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Киносовет — персональный киноассистент</title><desc id="desc">Три рекомендации под настроение, время и вкус пользователя</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26133e"/><stop offset="1" stop-color="#0b0b16"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b35ff"/><stop offset="1" stop-color="#c151ff"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><circle cx="1020" cy="60" r="250" fill="#8b35ff" opacity=".12"/><text x="72" y="80" fill="#c59de8" font-family="Arial" font-size="18" letter-spacing="4">КОНКУРСНЫЙ ПРОТОТИП · AI-КИНОАССИСТЕНТ</text><text x="72" y="170" fill="#fff" font-family="Arial" font-size="64" font-weight="700">Киносовет</text><text x="72" y="220" fill="#d6cbe2" font-family="Arial" font-size="25">Фильм, который совпадёт</text><text x="72" y="254" fill="#d6cbe2" font-family="Arial" font-size="25">с твоим настроением</text><rect x="72" y="300" width="260" height="58" rx="14" fill="url(#a)"/><text x="105" y="337" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Подобрать фильм →</text><g transform="translate(630 105)"><rect width="470" height="300" rx="20" fill="#151020" stroke="#59406e"/><text x="28" y="42" fill="#bd91e8" font-family="Arial" font-size="15">ПЕРСОНАЛЬНАЯ ПОДБОРКА</text><text x="28" y="78" fill="#fff" font-family="Arial" font-size="27" font-weight="700">Вот 3 фильма для тебя</text><g transform="translate(28 105)"><rect width="126" height="145" rx="12" fill="#55304c"/><rect x="143" width="126" height="145" rx="12" fill="#29455c"/><rect x="286" width="126" height="145" rx="12" fill="#70452d"/><text x="12" y="132" fill="#fff" font-family="Arial" font-size="14">Подарок</text><text x="154" y="132" fill="#fff" font-family="Arial" font-size="14">Виновный</text><text x="297" y="132" fill="#fff" font-family="Arial" font-size="14">Лок</text></g></g></svg>
